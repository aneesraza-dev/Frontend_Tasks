<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Shooter</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: black;
            color: white;
            font-family: Arial;
        }

        canvas {
            display: block;
            background: black;
        }

        #score {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 20px;

        }

        #score>h1 {
            text-shadow: 0px 0px 10px white;
        }

        #gameover {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40px;
            display: none;
            text-align: center;
        }
    </style>
</head>

<body>


    <div id="score">

        <h1>Space Shooter</h1>
        Score: 0
    </div>
    </div>
    <div id="gameover">GAME OVER<br>Refresh to Restart</div>
    <canvas id="c"></canvas>

    <script>
        const c = document.getElementById("c");
        const ctx = c.getContext("2d");
        c.width = innerWidth;
        c.height = innerHeight;

        let player = { x: c.width / 2, y: c.height - 80, w: 40, h: 40 };
        let bullets = [];
        let enemies = [];
        let score = 0;
        let keys = {};

        document.addEventListener("keydown", e => keys[e.key] = true);
        document.addEventListener("keyup", e => keys[e.key] = false);

        function spawnEnemy() {
            enemies.push({
                x: Math.random() * c.width,
                y: -50,
                w: 40,
                h: 40,
                speed: 2 + Math.random() * 2
            });
        }

        setInterval(spawnEnemy, 1000);

        function shoot() {
            bullets.push({ x: player.x + 18, y: player.y, w: 4, h: 10 });
        }
        setInterval(shoot, 300);

        function update() {
            ctx.clearRect(0, 0, c.width, c.height);

            if (keys["ArrowLeft"] && player.x > 0) player.x -= 6;
            if (keys["ArrowRight"] && player.x < c.width - player.w) player.x += 6;

            ctx.fillStyle = "cyan";
            ctx.fillRect(player.x, player.y, player.w, player.h);

            bullets.forEach((b, i) => {
                b.y -= 8;
                ctx.fillStyle = "yellow";
                ctx.fillRect(b.x, b.y, b.w, b.h);
                if (b.y < 0) bullets.splice(i, 1);
            });

            enemies.forEach((e, ei) => {
                e.y += e.speed;
                ctx.fillStyle = "red";
                ctx.fillRect(e.x, e.y, e.w, e.h);

                bullets.forEach((b, bi) => {
                    if (b.x < e.x + e.w && b.x + b.w > e.x &&
                        b.y < e.y + e.h && b.y + b.h > e.y) {
                        enemies.splice(ei, 1);
                        bullets.splice(bi, 1);
                        score++;
                        document.getElementById("score").innerText = "Score: " + score;
                    }
                });

                if (e.y + e.h > player.y &&
                    e.x < player.x + player.w &&
                    e.x + e.w > player.x) {
                    document.getElementById("gameover").style.display = "block";
                    cancelAnimationFrame(anim);
                }
            });

            anim = requestAnimationFrame(update);
        }
        let anim = update();
    </script>

</body>

</html>
