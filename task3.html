<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Loader</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #111
        }

        .tank {
            width: 200px;
            height: 300px;
            border: 5px solid #555;
            position: relative;
            overflow: hidden;
            border-radius: 10px
        }

        .water {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 0;
            background: linear-gradient(#00c6ff, #0072ff)
        }

        .percent {
            position: absolute;
            width: 100%;
            text-align: center;
            top: 40%;
            color: #fff;
            font-size: 30px
        }
    </style>
</head>

<body>
    <div class="tank">
        <div class="water" id="water"></div>
        <div class="percent" id="p">0%</div>
    </div>
    <script>
        let w = document.getElementById("water");
        let p = document.getElementById("p");
        let level = 0;
        setInterval(() => {
            if (level <= 100) {
                w.style.height = level + "%";
                p.innerText = level + "%";
                level++;
            }
        }, 60);
    </script>
</body>

</html>
