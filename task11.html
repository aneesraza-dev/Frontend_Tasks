<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Search Engine Clone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: white;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header {
            display: flex;
            justify-content: flex-end;
            padding: 12px 40px;
            font-size: 14px;
            align-items: center;
            gap: 20px;
        }

        .header a {
            text-decoration: none;
            color: #5f6368;
            font-weight: 500;
        }

        .header .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .logo img {
            width: 272px;
            margin-bottom: 24px;
        }

        .search-container {
            position: relative;
            width: 90%;
            max-width: 584px;
        }

        .search-container input {
            width: 100%;
            padding: 12px 48px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            font-size: 16px;
            outline: none;
            box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
        }

        .search-container input:focus {
            border: 1px solid #4285f4;
            box-shadow: 0 1px 6px rgba(66, 133, 244, 0.3);
        }

        .search-container .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            opacity: 0.6;
        }

        .search-container .mic-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            cursor: pointer;
            opacity: 0.6;
        }

        .buttons {
            margin-top: 24px;
            display: flex;
            gap: 10px;
        }

        .buttons button {
            padding: 10px 20px;
            font-size: 14px;
            border: none;
            background: #f8f9fa;
            border-radius: 4px;
            cursor: pointer;
        }

        .buttons button:hover {
            background: #f1f3f4;
        }

        .footer {
            background: #f2f2f2;
            text-align: center;
            padding: 16px 0;
            font-size: 14px;
            color: #5f6368;
        }

        .footer a {
            margin: 0 8px;
            color: #5f6368;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="header">
        <a href="#">Gmail</a>
        <a href="#">Images</a>
        <img class="avatar" src="https://i.pravatar.cc/32">
    </div>

    <div class="main">
        <div class="logo">
            <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png" alt="Google">
        </div>
        <div class="search-container">
            <input type="text" placeholder="Search Google or type a URL">
        </div>
        <div class="buttons">
            <button>Google Search</button>
            <button>I'm Feeling Lucky</button>
        </div>
    </div>

    <div class="footer">
        <a>Advertising</a>•<a>Business</a>•<a>About</a>•<a>Privacy</a>•<a>Terms</a>•<a>Settings</a>
    </div>

</body>

</html>
